<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LyricQ — Frank Ocean</title>
<style>
:root{
  --ink:#12100F;
  --panel:#1B1817;
  --panel-2:#252120;
  --line:rgba(237,231,222,.13);
  --bone:#EDE7DE;
  --dim:#948B83;
  --iris:#A493FF;
  --easy:#7BC98E;
  --medium:#E3B25E;
  --hard:#E37766;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}
.app{
  width:100%;max-width:460px;
  min-height:100vh;min-height:100dvh;
  display:grid;grid-template-rows:auto 1fr auto;
  padding:0 20px;
}

/* ---------- header ---------- */
.head{padding:22px 0 0}
.headrow{display:flex;align-items:baseline;justify-content:space-between}
.mark{
  font-family:var(--mono);font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--bone);
}
.mark i{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--iris);margin-left:4px;vertical-align:2px;font-style:normal}
.score{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.segs{display:flex;gap:4px;margin-top:14px}
.seg{flex:1;height:2px;background:rgba(237,231,222,.12);border-radius:2px;transition:background .25s}
.seg--now{background:var(--iris)}
.seg--hit{background:var(--easy)}
.seg--miss{background:var(--hard)}
.head[data-hide="1"] .segs,.head[data-hide="1"] .score{visibility:hidden}

/* ---------- stage ---------- */
main{display:flex;flex-direction:column;justify-content:center;padding:26px 0}
.rise{animation:rise .34s ease both}
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* ---------- welcome ---------- */
.hero{font-family:var(--serif);font-size:clamp(46px,15vw,62px);line-height:.95;letter-spacing:-.02em}
.hero em{font-style:italic;color:var(--iris)}
.tag{margin-top:18px;font-size:16px;line-height:1.55;color:var(--bone);max-width:22em}
.meta{margin-top:22px;font-family:var(--mono);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);line-height:1.9}
.note{
  margin-top:26px;border:1px dashed var(--line);border-radius:10px;
  padding:13px 14px;font-size:13px;line-height:1.55;color:var(--dim);
}
.note b{color:var(--bone);font-weight:600}
.note code{font-family:var(--mono);font-size:12px;color:var(--iris)}

/* ---------- lyric card ---------- */
.card{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:30px 22px 26px;overflow:hidden;
}
.card::before{
  content:"\201D";position:absolute;top:-96px;right:-4px;
  font-family:var(--serif);font-size:250px;line-height:1;color:var(--bone);
  opacity:.05;pointer-events:none;
}
.cardtop{display:flex;align-items:center;justify-content:space-between;position:relative}
.badge{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  padding:4px 9px;border-radius:999px;
}
.badge--easy{color:var(--easy);background:rgba(123,201,142,.13)}
.badge--medium{color:var(--medium);background:rgba(227,178,94,.13)}
.badge--hard{color:var(--hard);background:rgba(227,119,102,.13)}
.round{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dim)}
.lyric{
  position:relative;font-family:var(--serif);font-size:clamp(21px,6.2vw,28px);
  line-height:1.45;text-align:center;white-space:pre-line;
  padding:30px 4px 8px;
}
.stub{
  display:inline-block;margin-top:14px;font-family:var(--mono);font-size:9px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--line);border-radius:4px;padding:3px 7px;
}

/* reveal */
.reveal{margin-top:22px;border-top:1px solid var(--line);padding-top:18px;position:relative}
.verdict{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.verdict--hit{color:var(--easy)}
.verdict--miss{color:var(--hard)}
.answer{font-family:var(--serif);font-size:23px;margin-top:9px;line-height:1.25}
.album{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:7px}
.yours{font-size:13px;color:var(--dim);margin-top:12px}
.card--hit{border-color:rgba(123,201,142,.4)}
.card--miss{border-color:rgba(227,119,102,.4)}

/* ---------- game over ---------- */
.final{font-family:var(--serif);font-size:76px;line-height:1;letter-spacing:-.03em}
.final span{color:var(--dim)}
.verdictline{margin-top:12px;font-size:16px;color:var(--bone)}
.list{margin-top:28px;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.row .n{font-family:var(--mono);font-size:11px;color:var(--dim);width:18px}
.row .t{flex:1;font-size:15px;line-height:1.3}
.row .t small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-top:3px}
.row .k{font-family:var(--mono);font-size:13px}
.k--hit{color:var(--easy)}
.k--miss{color:var(--hard)}

/* ---------- dock ---------- */
.dock{padding-bottom:max(20px,env(safe-area-inset-bottom));padding-top:6px}
.suggest{
  border:1px solid var(--line);border-radius:12px;background:var(--panel-2);
  overflow:hidden;margin-bottom:8px;
}
.opt{
  display:block;width:100%;text-align:left;background:none;border:0;
  color:var(--bone);font-family:var(--sans);font-size:16px;
  padding:13px 15px;cursor:pointer;border-top:1px solid var(--line);
}
.opt:first-child{border-top:0}
.opt[data-active="1"]{background:rgba(164,147,255,.15);color:#fff}
.opt mark{background:none;color:var(--iris);font-weight:600}
.empty{padding:13px 15px;font-size:14px;color:var(--dim)}
input[type=text]{
  width:100%;background:var(--panel-2);color:var(--bone);
  border:1px solid var(--line);border-radius:12px;
  padding:15px 16px;font-family:var(--sans);font-size:16px;outline:none;
}
input[type=text]::placeholder{color:var(--dim)}
input[type=text]:focus{border-color:var(--iris)}
.btn{
  width:100%;background:var(--iris);color:#191320;border:0;border-radius:12px;
  padding:16px;font-family:var(--sans);font-size:15px;font-weight:650;
  letter-spacing:.01em;cursor:pointer;
}
.btn--ghost{background:none;color:var(--bone);border:1px solid var(--line)}
.btn:active{transform:translateY(1px)}
:focus-visible{outline:2px solid var(--iris);outline-offset:2px}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="app">
  <header class="head" id="head" data-hide="1">
    <div class="headrow">
      <div class="mark">LyricQ<i></i></div>
      <div class="score" id="score">Score 0</div>
    </div>
    <div class="segs" id="segs"></div>
  </header>

  <main id="stage"></main>

  <div class="dock">
    <div class="suggest" id="suggest" hidden></div>
    <input type="text" id="search" placeholder="Type a song title"
           autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
           aria-label="Search Frank Ocean song titles" hidden>
    <button class="btn" id="action" hidden></button>
  </div>
</div>

<script>
/* ============================================================
   DATA lives in lyrics.json — edit that file, not this one.
   ============================================================ */

var QUESTIONS = [];
var SONGS = [];

/* ============================================================
   GAME
   ============================================================ */

var MAX_SUGGESTIONS = 5;

var stage   = document.getElementById("stage");
var head    = document.getElementById("head");
var segsEl  = document.getElementById("segs");
var scoreEl = document.getElementById("score");
var input   = document.getElementById("search");
var suggest = document.getElementById("suggest");
var action  = document.getElementById("action");

var order = [], turn = 0, results = [];
var hits = [], active = 0;

function shuffle(list){
  var a = list.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
  });
}

/* Word-start positions: index 0, plus any letter/digit that follows punctuation. */
function starts(str){
  var out = [], word = /[a-z0-9]/;
  for (var i = 0; i < str.length; i++){
    if (!word.test(str[i])) continue;
    if (i === 0 || !word.test(str[i-1]) && str[i-1] !== "'") out.push(i);
  }
  return out;
}

function findMatches(raw){
  var q = raw.trim().toLowerCase();
  if (!q) return [];
  var lead = [], inner = [];
  for (var i = 0; i < SONGS.length; i++){
    var low = SONGS[i].toLowerCase();
    if (low.indexOf(q) === 0){ lead.push(SONGS[i]); continue; }
    var pos = starts(low);
    for (var p = 0; p < pos.length; p++){
      if (low.startsWith(q, pos[p])){ inner.push(SONGS[i]); break; }
    }
  }
  return lead.concat(inner).slice(0, MAX_SUGGESTIONS);
}

function highlight(title, raw){
  var q = raw.trim().toLowerCase();
  var low = title.toLowerCase();
  var at = -1;
  if (low.indexOf(q) === 0) at = 0;
  else {
    var pos = starts(low);
    for (var p = 0; p < pos.length; p++){
      if (low.startsWith(q, pos[p])){ at = pos[p]; break; }
    }
  }
  if (at < 0) return esc(title);
  return esc(title.slice(0, at)) + "<mark>" + esc(title.slice(at, at + q.length)) +
         "</mark>" + esc(title.slice(at + q.length));
}

function pendingPlaceholders(){
  return QUESTIONS.filter(function(q){ return q.placeholder; }).length;
}

/* ---------- screens ---------- */

function showWelcome(){
  head.setAttribute("data-hide", "1");
  suggest.hidden = true; input.hidden = true;
  var left = pendingPlaceholders();
  stage.innerHTML =
    '<div class="rise">' +
      '<h1 class="hero">Name<br>that <em>song</em></h1>' +
      '<p class="tag">' + QUESTIONS.length + ' Frank Ocean lyrics, one at a time. Pick the song they came from.</p>' +
      '<div class="meta">Frank Ocean &middot; ' + QUESTIONS.length + ' rounds<br>Channel Orange &middot; Blonde</div>' +
      (left ? '<div class="note"><b>' + left + ' of ' + QUESTIONS.length +
              ' lyrics are still placeholders.</b><br>Open this file and fill in the ' +
              '<code>lyric</code> fields in <code>QUESTIONS</code>, then set that song\'s ' +
              '<code>placeholder</code> to <code>false</code>.</div>' : '') +
    '</div>';
  action.hidden = false;
  action.className = "btn";
  action.textContent = "Play";
  action.onclick = startGame;
}

function startGame(){
  order = shuffle(QUESTIONS);
  turn = 0; results = []; hits = [];
  showRound();
}

function drawHeader(){
  head.setAttribute("data-hide", "0");
  var made = results.filter(function(r){ return r.correct; }).length;
  scoreEl.textContent = "Score " + made;
  segsEl.innerHTML = "";
  for (var i = 0; i < order.length; i++){
    var d = document.createElement("div");
    d.className = "seg" +
      (i < results.length ? (results[i].correct ? " seg--hit" : " seg--miss")
                          : (i === turn ? " seg--now" : ""));
    segsEl.appendChild(d);
  }
}

function showRound(){
  var q = order[turn];
  drawHeader();
  stage.innerHTML =
    '<article class="card rise">' +
      '<div class="cardtop">' +
        '<span class="badge badge--' + q.difficulty + '">' + q.difficulty + '</span>' +
        '<span class="round">' + pad(turn + 1) + ' / ' + pad(order.length) + '</span>' +
      '</div>' +
      '<div class="lyric">' + esc(q.lyric) +
        (q.placeholder ? '<br><span class="stub">Placeholder</span>' : '') +
      '</div>' +
    '</article>';

  action.hidden = true;
  input.hidden = false;
  input.value = "";
  input.placeholder = "Type a song title";
  drawSuggestions();
  if (!("ontouchstart" in window)) input.focus();
}

function pad(n){ return (n < 10 ? "0" : "") + n; }

function drawSuggestions(){
  hits = findMatches(input.value);
  if (!input.value.trim()){
    suggest.hidden = true;
    return;
  }
  suggest.hidden = false;
  if (!hits.length){
    suggest.innerHTML = '<div class="empty">No song by that name. Try fewer letters.</div>';
    return;
  }
  if (active >= hits.length) active = 0;
  /* Best match sits closest to the input, at the bottom of the list. */
  var html = "";
  for (var i = hits.length - 1; i >= 0; i--){
    html += '<button class="opt" type="button" data-i="' + i + '"' +
            (i === active ? ' data-active="1"' : '') + '>' +
            highlight(hits[i], input.value) + '</button>';
  }
  suggest.innerHTML = html;
}

function guess(title){
  var q = order[turn];
  var correct = title === q.song;
  results.push({ song: q.song, album: q.album, difficulty: q.difficulty,
                 guessed: title, correct: correct });
  drawHeader();

  var card = stage.querySelector(".card");
  card.className = "card " + (correct ? "card--hit" : "card--miss");
  var block = document.createElement("div");
  block.className = "reveal";
  block.innerHTML =
    '<div class="verdict verdict--' + (correct ? "hit" : "miss") + '">' +
      (correct ? "Correct" : "Not quite") + '</div>' +
    '<div class="answer">' + esc(q.song) + '</div>' +
    '<div class="album">' + esc(q.album) + '</div>' +
    (correct ? '' : '<div class="yours">You picked ' + esc(title) + '</div>');
  card.appendChild(block);

  input.hidden = true;
  suggest.hidden = true;
  action.hidden = false;
  action.className = "btn";
  action.textContent = turn === order.length - 1 ? "See results" : "Next lyric";
  action.onclick = next;
}

function next(){
  turn++;
  if (turn >= order.length) showOver();
  else showRound();
}

function showOver(){
  var made = results.filter(function(r){ return r.correct; }).length;
  head.setAttribute("data-hide", "1");

  var total = results.length;
  var verdict;
  if (made === 0) verdict = "None landed. Go again.";
  else if (made === total) verdict = "All " + total + ". Perfect run.";
  else if (made === 1) verdict = "One landed.";
  else if (made / total >= 0.6) verdict = made + " out of " + total + ". Solid.";
  else verdict = made + " out of " + total + ". " + (total - made) + " got away.";
  var rows = "";
  for (var i = 0; i < results.length; i++){
    var r = results[i];
    rows +=
      '<div class="row">' +
        '<span class="n">' + pad(i + 1) + '</span>' +
        '<span class="t">' + esc(r.song) + '<small>' + esc(r.album) + ' &middot; ' + r.difficulty + '</small></span>' +
        '<span class="k k--' + (r.correct ? "hit" : "miss") + '">' + (r.correct ? "\u2713" : "\u2715") + '</span>' +
      '</div>';
  }

  stage.innerHTML =
    '<div class="rise">' +
      '<div class="final">' + made + '<span>/' + results.length + '</span></div>' +
      '<p class="verdictline">' + verdict + '</p>' +
      '<div class="list">' + rows + '</div>' +
    '</div>';

  input.hidden = true; suggest.hidden = true;
  action.hidden = false;
  action.className = "btn";
  action.textContent = "Play again";
  action.onclick = startGame;
}

/* ---------- input wiring ---------- */

input.addEventListener("input", function(){ active = 0; drawSuggestions(); });

input.addEventListener("keydown", function(e){
  if (!hits.length) return;
  if (e.key === "ArrowUp"){        /* up = further from the input = next best down the list */
    e.preventDefault();
    active = Math.min(active + 1, hits.length - 1);
    drawSuggestions();
  } else if (e.key === "ArrowDown"){
    e.preventDefault();
    active = Math.max(active - 1, 0);
    drawSuggestions();
  } else if (e.key === "Enter"){
    e.preventDefault();
    guess(hits[active]);
  } else if (e.key === "Escape"){
    input.value = ""; drawSuggestions();
  }
});

suggest.addEventListener("mousedown", function(e){ e.preventDefault(); });
suggest.addEventListener("click", function(e){
  var btn = e.target.closest(".opt");
  if (btn) guess(hits[Number(btn.dataset.i)]);
});

/* Load lyrics data, then start */
fetch("lyrics.json")
  .then(function(r){ return r.json(); })
  .then(function(data){
    QUESTIONS = data.questions;
    SONGS = data.songs;
    showWelcome();
  })
  .catch(function(){
    stage.innerHTML =
      '<div class="rise">' +
        '<h1 class="hero" style="font-size:clamp(28px,8vw,38px)">Couldn\u2019t load lyrics</h1>' +
        '<p class="tag">Make sure <code style="font-family:var(--mono);color:var(--iris)">lyrics.json</code> ' +
        'is in the same folder as this page.</p>' +
      '</div>';
  });
</script>
</body>
</html>
